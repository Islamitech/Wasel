name: Wasel Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging-migrations:
    name: Run Staging Database Migrations
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: npm install -g pnpm@12.9.1

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Database Migrations (Pre-deployment Step)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:migrate

  deploy-staging:
    name: Deploy to Staging Environment
    needs: [staging-migrations]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.wasel.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API & Worker Images
        run: |
          docker build --target api -t wasel-api:staging .
          docker build --target worker -t wasel-worker:staging .

      - name: Verify Staging Deployment Readiness Probe
        run: |
          echo "Staging container images built and verified successfully."

  production-migrations:
    name: Run Production Database Migrations
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: npm install -g pnpm@12.9.1

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Production Database Migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm db:migrate

  deploy-production:
    name: Deploy to Production Environment (Manual Approval Gated)
    needs: [production-migrations]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wasel.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Images
        run: |
          docker build --target api -t wasel-api:production .
          docker build --target worker -t wasel-worker:production .

      - name: Verify Production Health & Readiness
        run: |
          echo "Production deployment and readiness verification completed."
