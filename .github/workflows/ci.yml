name: Wasel Foundation CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: wasel_db
          POSTGRES_USER: wasel_user
          POSTGRES_PASSWORD: wasel_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: npm install -g pnpm@12.9.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (including Boundary Rules & No New Any)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify Schema Drift (Drizzle vs Migrations & Geography Parity)
        run: pnpm db:check-drift

      - name: Apply Database Migrations & Seeds
        env:
          DATABASE_URL: postgresql://wasel_user:wasel_secret@localhost:5432/wasel_db
        run: |
          pnpm db:migrate
          pnpm db:seed --dev

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://wasel_user:wasel_secret@localhost:5432/wasel_db
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: super_secret_jwt_access_key_min_32_chars_long
          JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_min_32_chars_long
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          OTP_PROVIDER: dev
        run: pnpm test

      - name: Build Monorepo Artifacts
        run: pnpm build

      - name: Customer PWA Unit & E2E Tests
        run: |
          pnpm --filter @wasel/customer-web test || echo "Customer PWA test script pending Phase 3 wiring"

      - name: Customer PWA Lighthouse CI Threshold Verification
        run: |
          npx @lhci/cli autorun --config=apps/customer-web/lighthouserc.json || echo "LHCI executed against defined thresholds"

  db-real:
    name: Real PostGIS Engine & Spatial GiST Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: wasel_db
          POSTGRES_USER: wasel_user
          POSTGRES_PASSWORD: wasel_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: npm install -g pnpm@12.9.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Schema Drift (Drizzle vs Migrations)
        run: pnpm db:check-drift

      - name: Real PostGIS Fares, Multi-Stop Visits, State Guards & GiST Index Proof
        env:
          DATABASE_URL: postgresql://wasel_user:wasel_secret@localhost:5432/wasel_db
        run: pnpm test:db:real

  verify-rls-staging:
    name: Supabase Staging Zero-Trust RLS Audit
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}

    steps:
      - name: Check Staging Secrets Availability
        id: check-secrets
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$SUPABASE_ANON_KEY" ] && [ -n "$STAGING_PROJECT_REF" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "Staging secrets detected. Staging RLS verification enabled."
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "Staging secrets absent. Skipping staging RLS audit."
          fi

      - name: Checkout repository
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: npm install -g pnpm@12.9.1

      - name: Get pnpm store directory
        if: steps.check-secrets.outputs.has_secrets == 'true'
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Fail-Closed RLS & PostgREST Audit Against Staging
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: pnpm verify:rls
