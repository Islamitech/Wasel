name: Wasel Foundation CI

on:
  push:
    branches: [main, develop, 'chore/**', 'feat/**']
  pull_request:
    branches: [main, develop]

jobs:
  gitleaks:
    name: Gitleaks Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  audit:
    name: Production Dependencies Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        run: npm install -g pnpm@12.9.1
      - name: Run pnpm audit (production high+)
        run: pnpm audit --prod --audit-level high

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  build-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: wasel_db
          POSTGRES_USER: wasel_user
          POSTGRES_PASSWORD: wasel_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: npm install -g pnpm@12.9.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (including Boundary Rules & No New Any)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Monorepo Artifacts
        env:
          VITE_API_URL: http://127.0.0.1:3000
        run: |
          pnpm --filter @wasel/shared build
          pnpm build

      - name: Verify Schema Drift (Drizzle vs Migrations & Geography Parity)
        run: pnpm db:check-drift

      - name: Setup PostgreSQL Roles & Initial Config
        env:
          PGUSER: wasel_user
          PGPASSWORD: wasel_secret
          PGHOST: 127.0.0.1
        run: |
          sleep 2
          psql -h 127.0.0.1 -U wasel_user -d wasel_db -c "CREATE ROLE anon NOLOGIN;" 2>/dev/null || true
          psql -h 127.0.0.1 -U wasel_user -d wasel_db -c "CREATE ROLE authenticated NOLOGIN;" 2>/dev/null || true
          psql -h 127.0.0.1 -U wasel_user -d wasel_db -c "GRANT USAGE ON SCHEMA public TO anon, authenticated;" 2>/dev/null || true

      - name: Apply Database Migrations & Seeds on PostGIS Service
        env:
          DATABASE_URL: postgresql://wasel_user:wasel_secret@127.0.0.1:5432/wasel_db
        run: |
          pnpm db:migrate
          pnpm db:seed:dev

      - name: Run Tests (All Workspaces with Strict Env)
        env:
          DATABASE_URL: postgresql://wasel_user:wasel_secret@127.0.0.1:5432/wasel_db
          REDIS_URL: redis://127.0.0.1:6379
          JWT_ACCESS_SECRET: super_secret_jwt_access_key_min_32_chars_long
          JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_min_32_chars_long
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          OTP_PROVIDER: dev
          METRICS_TOKEN: test_metrics_token_secret_123456
          VITE_API_URL: http://127.0.0.1:3000
        run: pnpm test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start API Service for E2E
        env:
          PORT: 3000
          NODE_ENV: test
          APP_ENV: test
          DATABASE_URL: postgresql://wasel_user:wasel_secret@127.0.0.1:5432/wasel_db
          REDIS_URL: redis://127.0.0.1:6379
          JWT_ACCESS_SECRET: super_secret_jwt_access_key_min_32_chars_long
          JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_min_32_chars_long
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          OTP_PROVIDER: dev
          METRICS_TOKEN: test_metrics_token_secret_123456
        run: |
          node apps/api/dist/main.js &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3000/health | grep -q "ok"; then
              echo "API server is ready for E2E testing."
              break
            fi
            echo "Waiting for API server to become ready ($i/30)..."
            sleep 1
          done

      - name: Playwright E2E Tests (Customer & Driver PWAs)
        run: |
          pnpm --filter @wasel/customer-web test:e2e
          pnpm --filter @wasel/driver-web test:e2e

      - name: Customer PWA Lighthouse CI Threshold Verification
        run: npx @lhci/cli autorun --config=apps/customer-web/lighthouserc.json

      - name: Driver PWA Lighthouse CI Threshold Verification
        run: npx @lhci/cli autorun --config=apps/driver-web/lighthouserc.json

  db-real:
    name: Real PostGIS Engine & Spatial GiST Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: wasel_db
          POSTGRES_USER: wasel_user
          POSTGRES_PASSWORD: wasel_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: npm install -g pnpm@12.9.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared & API Packages for Schema Drift Check
        run: |
          pnpm --filter @wasel/shared build
          pnpm --filter @wasel/api build

      - name: Verify Schema Drift (Drizzle vs Migrations)
        run: pnpm db:check-drift

      - name: Setup PostgreSQL Roles & Initial Config
        env:
          PGUSER: wasel_user
          PGPASSWORD: wasel_secret
          PGHOST: 127.0.0.1
        run: |
          sleep 2
          psql -h 127.0.0.1 -U wasel_user -d wasel_db -c "CREATE ROLE anon NOLOGIN;" 2>/dev/null || true
          psql -h 127.0.0.1 -U wasel_user -d wasel_db -c "CREATE ROLE authenticated NOLOGIN;" 2>/dev/null || true
          psql -h 127.0.0.1 -U wasel_user -d wasel_db -c "GRANT USAGE ON SCHEMA public TO anon, authenticated;" 2>/dev/null || true

      - name: Real PostGIS Fares, Multi-Stop Visits, State Guards & GiST Index Proof
        env:
          DATABASE_URL: postgresql://wasel_user:wasel_secret@127.0.0.1:5432/wasel_db
        run: pnpm test:db:real

  verify-rls-staging:
    name: Supabase Staging Zero-Trust RLS Audit
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}

    steps:
      - name: Check Staging Secrets Availability
        id: check-secrets
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$SUPABASE_ANON_KEY" ] && [ -n "$STAGING_PROJECT_REF" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "Staging secrets detected. Staging RLS verification enabled."
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "Staging secrets absent. Skipping staging RLS audit."
          fi

      - name: Checkout repository
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: npm install -g pnpm@12.9.1

      - name: Get pnpm store directory
        if: steps.check-secrets.outputs.has_secrets == 'true'
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Fail-Closed RLS & PostgREST Audit Against Staging
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: pnpm verify:rls
